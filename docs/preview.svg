  <rect x="880" y="330" width="160" height="160" rx="10" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
  <rect x="900" y="350" width="120" height="14" rx="3" fill="#0a6" opacity="0.25"/>
  <rect x="900" y="374" width="120" height="8" rx="2" fill="#e5e5e5"/>
  <rect x="900" y="390" width="100" height="8" rx="2" fill="#e5e5e5"/>
  <rect x="900" y="412" width="120" height="8" rx="2" fill="#e5e5e5"/>
  <rect x="900" y="446" width="120" height="28" rx="6" fill="#0a6"/>
  <text x="918" y="465" fill="#ffffff" font-size="12" font-weight="600">download ✓</text>
