  <text x="160" y="290" fill="#666666" font-size="17">One API key unlocks all three. No browser farm to run.</text>
  <!-- three feature chips -->
  <g>
    <rect x="160" y="320" width="220" height="64" rx="10" fill="#f4f4f5"/>
