<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="600" fill="#fafafa"/>
  <!-- window card -->
  <rect x="120" y="90" width="960" height="420" rx="16" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
  <!-- top bar -->
  <rect x="120" y="90" width="960" height="56" rx="16" fill="#0a6"/>
  <rect x="120" y="120" width="960" height="26" fill="#0a6"/>
  <circle cx="156" cy="118" r="6" fill="#ffffff" opacity="0.85"/>
  <circle cx="178" cy="118" r="6" fill="#ffffff" opacity="0.6"/>
  <circle cx="200" cy="118" r="6" fill="#ffffff" opacity="0.4"/>
  <text x="240" y="124" fill="#ffffff" font-size="18" font-weight="600">url-to-pdf</text>
